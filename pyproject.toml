[project]
name = "bytemescan"
version = "0.1.0"
description = "식약처 공개 명부에 화장품 기능성 주장을 대조하는 얇은 MCP/CLI (공개 데이터 전용)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.2"]

[project.scripts]
bytemescan = "bytemescan.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bytemescan"]
